[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Rutas amigables: /api/visita -> /.netlify/functions/visita
# (debe ir ANTES del fallback de abajo)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Fallback de React Router: /habilidades-desarrollador, /cualquier-ruta, etc.
# devuelven el index.html para que la app funcione al entrar directo por URL
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache del sitio para que cargue rápido
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"