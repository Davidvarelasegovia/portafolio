[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vite 8 exige Node "^20.19.0 || >=22.12.0".
  # Con "20" a secas, Netlify instalaba una 20.x anterior y el build fallaba.
  NODE_VERSION = "22.12.0"

# ---------------------------------------------------------------
# Rutas de la API
# ---------------------------------------------------------------
# Las funciones de admin viven en la RAIZ con el prefijo admin-.
# no funcionan con el comodin "/api/*": el splat no resuelve las
# barras inclinadas y Netlify devuelve 404. Por eso cada ruta de
# admin tiene su regla exacta, escrita una por una.
#
# OJO: el orden importa. Estas reglas van ANTES del fallback final.

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin/habilidades"
  to = "/.netlify/functions/admin-habilidades"
  status = 200

[[redirects]]
  from = "/api/admin/recuperar"
  to = "/.netlify/functions/admin-recuperar"
  status = 200

[[redirects]]
  from = "/api/admin/cambiar-password"
  to = "/.netlify/functions/admin-cambiar-password"
  status = 200

# Funciones que estan en la raiz: el comodin si funciona para estas
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Fallback de React Router: /habilidades-desarrollador, /cualquier-ruta, etc.
# devuelven el index.html para que la app funcione al entrar directo por URL
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache del sitio para que cargue rápido
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"